name: Correctness and review gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make test-portable check-docs
      - name: Verify man pages with the pinned generator
        if: runner.os == 'Linux'
        run: make check-man PANDOC=scripts/ci/pandoc-container.sh
      - name: Native packet ownership checks
        run: make unit_packet_io unit_packet_io_lifetime LDFLAGS='' && ./unit_packet_io && ./unit_packet_io_lifetime
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Address and undefined behavior
        run: make test CC=clang CFLAGS='-O1 -g -Wall -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined'
        env:
          ASAN_OPTIONS: detect_leaks=0 # Legacy config fixtures retain maps.
      - name: New mapping fixtures must also pass leak detection
        run: |
          ASAN_OPTIONS=detect_leaks=1 ./build/test-bin/unit_addrmap
          ASAN_OPTIONS=detect_leaks=1 ./build/test-bin/unit_mapping
      - name: Thread sanitizer on mapping and counters
        run: |
          make clean
          make unit_addrmap unit_mapping unit_stats CC=gcc CFLAGS='-O1 -g -Wall -fsanitize=thread -fno-omit-frame-pointer -fno-pie' LDFLAGS='-fsanitize=thread -no-pie'
          ./build/test-bin/unit_addrmap
          ./build/test-bin/unit_mapping
          ./build/test-bin/unit_stats
        env:
          TSAN_OPTIONS: halt_on_error=1
  linux-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies and opt-in io_uring build
        run: sudo apt-get update && sudo apt-get install -y liburing-dev python3-scapy python3-pyroute2 iproute2 nftables tcpdump socat iputils-ping ethtool
      - name: Shell script errors
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=error $(git ls-files '*.sh')
      - name: Default build and incremental build regressions
        run: python3 scripts/ci/check-build.py
      - run: make WITH_URING=1 all test
      - name: Kernel negotiation, rollback, wire and lifecycle
        run: |
          set -o pipefail
          sudo mkdir -p /tmp/review-results/steering
          sudo chown "$USER:$USER" /tmp/review-results/steering
          sudo touch /tmp/tayga-perf-workflow.lock
          sudo python3 test/system/test_auto_negotiation.py --binary "$PWD/tayga" --output /tmp/review-results/negotiation
          sudo python3 test/system/test_auto_persistent.py --binary "$PWD/tayga" --output /tmp/review-results/persistent
          sudo python3 test/system/test_startup_rollback.py --binary "$PWD/tayga" --output /tmp/review-results/rollback
          sudo python3 test/system/test_worker_burst.py --binary "$PWD/tayga" --output /tmp/review-results/burst
          sudo python3 test/system/test_udp_gso_kernel.py --binary "$PWD/tayga" --output /tmp/review-results/wire --modes auto off tcp udp --workers 0 3 --mtus 1280 1500
          sudo python3 test/system/test_tun_steering_lifecycle.py "$PWD/tayga" --dispatch=kernel --packet-io=sync
          for mode in groups flows; do
            sudo python3 test/system/test_tun_steering.py --steering "$mode" 2>&1 | tee "/tmp/review-results/steering/$mode-direct.log"
            sudo python3 test/system/test_tun_steering_lifecycle.py "$PWD/tayga" --tun-steering="$mode" 2>&1 | tee "/tmp/review-results/steering/$mode-lifecycle.log"
          done
          sudo python3 test/system/test_tcp_split_tail_kernel.py --binary "$PWD/tayga" --output /tmp/review-results/tcp-tail
          sudo python3 test/system/test_recovery_ports.py --binary "$PWD/tayga" --output /tmp/review-results/recovery-ports
      - name: TCP and UDP payload integrity and end-to-end PMTUD
        run: |
          sudo install -m 755 tayga /usr/sbin/tayga
          sudo install -m 755 container/rootfs/usr/local/sbin/clat-start.sh /usr/local/sbin/clat-start.sh
          for mode in kernel groups flows; do
            sudo python3 bench/taygabench/studies/run-steering-integrity.py --binary "$PWD/tayga" --steering "$mode" --production-startup --output "/tmp/review-results/integrity-pmtud-$mode"
          done
      - name: Multi-protocol end-to-end system test
        run: |
          sudo python3 test/system/test_protocols_e2e.py --binary "$PWD/tayga" --output /tmp/review-results/protocols-e2e
      - name: Async kernel wire gate when io_uring is available
        run: |
          sudo mkdir -p /tmp/review-results && sudo chown -R "$USER:$USER" /tmp/review-results
          ./build/test-bin/unit_async_tun 2>&1 | tee /tmp/review-results/uring-availability.log
          if grep -q '^SKIP:' /tmp/review-results/uring-availability.log; then
            echo '::notice::Kernel io_uring unavailable; build succeeded, runtime gate skipped'
          else
            sudo python3 test/system/test_udp_gso_kernel.py --binary "$PWD/tayga" --packet-io uring --output /tmp/review-results/uring-wire --modes auto off --workers 3 --mtus 1280 1500
            sudo python3 test/system/test_tun_steering_lifecycle.py "$PWD/tayga" --dispatch=flows --packet-io=uring
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kernel-review-results
          path: /tmp/review-results
          if-no-files-found: warn
