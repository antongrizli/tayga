name: Build, Verify & Publish Release

on:
  push:
    tags: ['v*', 'version*', '[0-9]*']
  workflow_dispatch:
    inputs:
      ver:
        description: 'Prepared release tag; required only when candidate_only=false'
        required: false
        type: string
      candidate_only:
        description: 'Build/verify a candidate with a temporary key; never publish'
        required: true
        default: true
        type: boolean
      candidate_sha:
        description: 'Candidate commit SHA (40 lowercase hex); empty uses the selected workflow commit'
        required: false
        type: string

permissions:
  contents: read

# Serialize production publication; unpublished candidate runs have independent groups.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_only && github.run_id || 'publication' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and validate immutable source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      repository: ${{ steps.source.outputs.repository }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      candidate_only: ${{ steps.source.outputs.candidate_only }}
      linux_matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve candidate commit or prepared release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.ver }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/ci/release_metadata.py
      - name: Resolve enabled release platform matrix
        id: platforms
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git show "$RELEASE_SHA:packaging/release-platforms.json" > "$RUNNER_TEMP/release-platforms.json"
          matrix=$(python3 -c 'import json,sys; print(json.dumps({"include":json.load(open(sys.argv[1]))["linux"]}))' "$RUNNER_TEMP/release-platforms.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release-source.json
          if-no-files-found: error

  compiler-platform-gates:
    needs: resolve
    uses: ./.github/workflows/basic.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  correctness-gates:
    needs: resolve
    uses: ./.github/workflows/review-gates.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  integration:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-pyroute2 python3-scapy iproute2
      - run: sudo make integration VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_SHA" BRANCH="$RELEASE_TAG"
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-integration-results
          path: build/test-output/integration/
          if-no-files-found: warn

  prepare-artifacts:
    name: Prepare and smoke-test ${{ matrix.arch }} artifacts
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build static binaries, verify staged install and applicable image profiles
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/ci/release-build.sh "$RELEASE_ARCH" "$RELEASE_PLATFORM" release-source.json "candidate-$RELEASE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-build-failure-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: warn

  prepare-native-packages:
    name: Build native packages (DEB, RPM, APK) for release
    needs: [resolve, compiler-platform-gates, prepare-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install nFPM
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm"
          curl --fail --location --connect-timeout 10 --max-time 120 --proto '=https' --proto-redir '=https' \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/nfpm.tar.gz"
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> $GITHUB_PATH
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: candidates
      - name: Verify real nFPM package metadata for every release architecture
        env:
          NFPM_TEST_BINARY: ${{ runner.temp }}/nfpm/nfpm
        run: python3 -m unittest discover -s bench/tests -p test_package_metadata_nfpm.py
      - name: Build packages across all supported Linux architectures
        run: |
          mkdir -p release-native
          version="${{ needs.resolve.outputs.version }}"
          commit="${{ needs.resolve.outputs.sha }}"
          for arch in $(python3 scripts/ci/release_platforms.py linux-arches); do
            bin="candidates/candidate-$arch/tayga-linux-$arch"
            helper="candidates/candidate-$arch/pref64-discover-linux-$arch"
            if [ ! -f "$bin" ] || [ ! -f "$helper" ]; then
              echo "ERROR: Missing release binary $bin or helper $helper for $arch" >&2
              exit 1
            fi
            python3 scripts/build-native-packages.py \
              --version "$version" --release 1 --arch "$arch" \
              --tayga "$bin" --helper "$helper" \
              --maintainer "TAYGA Community <antongrizli@gmail.com>" \
              --source-commit "$commit" \
              --nfpm "$RUNNER_TEMP/nfpm/nfpm" \
              --output release-native
            python3 scripts/ci/package_metadata.py "release-native/tayga-managed-$version-1-$arch.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-native
          path: release-native/
          if-no-files-found: error

  verify-assets:
    if: needs.resolve.outputs.candidate_only != 'true'
    needs: [resolve, compiler-platform-gates, correctness-gates, integration, prepare-artifacts, prepare-native-packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: candidates
      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify all hashes and source identities; prepare pinned RouterOS assets
        env:
          MINISIGN_KEY_FILE: ${{ secrets.MINISIGN_KEY_FILE }}
          MINISIGN_KEY_DATA: ${{ secrets.MINISIGN_KEY_DATA }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBKEY: ${{ secrets.MINISIGN_PUBKEY }}
          REQUIRE_RELEASE_SIGNATURE: 'true'
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 scripts/ci/release_artifacts.py assemble --source release-source.json --directory candidates --output release-assets --require-signature
          python3 scripts/ci/release_publish.py release-assets --verify-only
          cd release-assets
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error

  verify-candidate-assets:
    if: needs.resolve.outputs.candidate_only == 'true'
    needs: [resolve, compiler-platform-gates, correctness-gates, integration, prepare-artifacts, prepare-native-packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: candidates
      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Assemble and verify unpublished candidate with a temporary signing key
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/candidate-signing"
          minisign -G -W -s "$RUNNER_TEMP/candidate-signing/key" -p "$RUNNER_TEMP/candidate-signing/pub"
          export MINISIGN_KEY_FILE="$RUNNER_TEMP/candidate-signing/key"
          export MINISIGN_PUBKEY_FILE="$RUNNER_TEMP/candidate-signing/pub"
          export MINISIGN_PASSWORD=''
          python3 scripts/ci/release_artifacts.py assemble --source release-source.json --directory candidates --output release-assets --require-signature
          python3 scripts/ci/release_publish.py release-assets --verify-only
          (cd release-assets && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-verification-public-key
          path: ${{ runner.temp }}/candidate-signing/pub
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: verified-candidate-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: needs.resolve.outputs.candidate_only != 'true'
    name: Publish verified artifacts without rebuilding
    needs: [resolve, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: release-assets
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify and promote saved images; record registry digests
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          MINISIGN_PUBKEY: ${{ secrets.MINISIGN_PUBKEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          cd release-assets
          sha256sum -c SHA256SUMS
          cd ..
          python3 scripts/ci/release_publish.py release-assets
      - name: Publish GitHub release with exact asset checksums and changelog notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: TAYGA ${{ needs.resolve.outputs.tag }}
          body_path: release-assets/release-notes.md
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*
          generate_release_notes: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-publication-evidence
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
