name: Release & Multi-Arch Build

on:
  workflow_dispatch:
    inputs:
      ver:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Tag release if triggered via workflow_dispatch
  tag-rel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag release
        run: |
          echo "#define TAYGA_VERSION \"${{ inputs.ver }}\"" > version.h
          echo "#define TAYGA_BRANCH \"main\"" >> version.h
          echo "#define TAYGA_COMMIT \"RELEASE\"" >> version.h
          echo "RELEASE=${{ inputs.ver }}" > release
          git add -f version.h release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "autogenerate release version file for ${{ inputs.ver }}"
          git tag -f ${{ inputs.ver }}
          git push origin ${{ inputs.ver }} --force

  # Build static binaries for each target architecture
  build-static:
    needs: [tag-rel]
    if: always() && (needs.tag-rel.result == 'success' || needs.tag-rel.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            artifact_name: tayga-linux-arm64-chateau
            desc: "MikroTik Chateau / CCR2004 / CCR2116 / RB5009 (ARM64)"
          - arch: armv7
            platform: linux/arm/v7
            artifact_name: tayga-linux-armv7
            desc: "MikroTik hAP ac2 / hAP ac3 / hAP ax2 / RB4011 (ARMv7)"
          - arch: amd64
            platform: linux/amd64
            artifact_name: tayga-linux-amd64
            desc: "MikroTik CHR / x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ver || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build static binary inside Alpine (${{ matrix.desc }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src alpine:3.20 sh -c \
            "apk add --no-cache gcc make musl-dev linux-headers binutils && make clean && make static && strip tayga && cp tayga ${{ matrix.artifact_name }} && cp tayga tayga-linux-${{ matrix.arch }}"
      - name: Run unit tests via QEMU
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src alpine:3.20 sh -c \
            "apk add --no-cache gcc make musl-dev linux-headers binutils && make test"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            tayga-linux-${{ matrix.arch }}
          if-no-files-found: error

  # Build and push multi-arch container images to GitHub Container Registry (GHCR)
  build-containers:
    needs: [tag-rel]
    if: always() && (needs.tag-rel.result == 'success' || needs.tag-rel.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ver || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine Version Tag and Repository
        id: meta
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          RAW_VER="${{ inputs.ver || github.ref_name }}"
          CLEAN_VER="${RAW_VER#v}"
          echo "repo=${REPO_LC}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
      - name: Build and Push Multi-Arch Base Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
      - name: Build and Push Multi-Arch CLAT Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final-clat
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-clat:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-clat:${{ steps.meta.outputs.version }}
      - name: Build and Push Multi-Arch NAT64 Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final-nat64
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-nat64:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-nat64:${{ steps.meta.outputs.version }}

  # Create GitHub Release with static binaries and checksums
  publish-release:
    needs: [build-static, build-containers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download all static binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true
      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum tayga-* > checksums.txt
          cat checksums.txt
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ver || github.ref_name }}
          name: TAYGA ${{ inputs.ver || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-binaries/*
          generate_release_notes: true

