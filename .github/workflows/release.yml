name: Build, Verify & Publish Release

on:
  push:
    tags: ['v*', 'version*', '[0-9]*']
  workflow_dispatch:
    inputs:
      ver:
        description: 'Existing prepared release tag (e.g. v0.9.14)'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases so two successful candidates cannot race on latest.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and validate release source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      repository: ${{ steps.source.outputs.repository }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag and verify committed metadata
        id: source
        env:
          RELEASE_TAG: ${{ inputs.ver }}
        run: python3 scripts/ci/release_metadata.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-source
          path: release-source.json
          if-no-files-found: error

  compiler-platform-gates:
    needs: resolve
    uses: ./.github/workflows/basic.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  correctness-gates:
    needs: resolve
    uses: ./.github/workflows/review-gates.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  integration:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-pyroute2 python3-scapy iproute2
      - run: sudo make integration VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_SHA" BRANCH="$RELEASE_TAG"
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-integration-results
          path: build/test-output/integration/
          if-no-files-found: warn

  prepare-artifacts:
    name: Prepare and smoke-test ${{ matrix.arch }} artifacts
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build static binaries, verify staged install, test all image profiles
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/ci/release-build.sh "$RELEASE_ARCH" "$RELEASE_PLATFORM" release-source.json "candidate-$RELEASE_ARCH"
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: release-build-failure-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}/
          compression-level: 0
          if-no-files-found: warn

  verify-assets:
    needs: [resolve, compiler-platform-gates, correctness-gates, integration, prepare-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: candidates
      - name: Verify all hashes and source identities; prepare pinned RouterOS assets
        run: |
          python3 scripts/ci/release_artifacts.py assemble --source release-source.json --directory candidates --output release-assets
          cd release-assets
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified artifacts without rebuilding
    needs: [resolve, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: release-assets
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote saved images; record registry digests
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          cd release-assets
          sha256sum -c SHA256SUMS
          cd ..
          python3 scripts/ci/release_publish.py release-assets
      - name: Publish GitHub release with exact asset checksums and changelog notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: TAYGA ${{ needs.resolve.outputs.tag }}
          body_path: release-assets/release-notes.md
          draft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*
          generate_release_notes: false
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-publication-evidence
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
