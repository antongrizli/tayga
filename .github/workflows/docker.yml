name: Build & Publish Container Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Names and Tags
        id: meta
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          BRANCH="${GITHUB_REF_NAME}"
          echo "repo=${REPO_LC}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Build & Push Base Image (ghcr.io/${{ steps.meta.outputs.repo }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.branch }}
            ghcr.io/${{ steps.meta.outputs.repo }}:sha-${{ steps.meta.outputs.sha }}

      - name: Build & Push CLAT Image (ghcr.io/${{ steps.meta.outputs.repo }}-clat)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final-clat
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-clat:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-clat:${{ steps.meta.outputs.branch }}
            ghcr.io/${{ steps.meta.outputs.repo }}-clat:sha-${{ steps.meta.outputs.sha }}

      - name: Build & Push NAT64 Image (ghcr.io/${{ steps.meta.outputs.repo }}-nat64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final-nat64
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-nat64:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-nat64:${{ steps.meta.outputs.branch }}
            ghcr.io/${{ steps.meta.outputs.repo }}-nat64:sha-${{ steps.meta.outputs.sha }}
