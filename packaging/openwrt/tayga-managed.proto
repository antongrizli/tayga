#!/bin/sh
# OpenWrt libraries and net_setup provide protocol helpers and parsed fields.
# shellcheck disable=SC2034,SC3043,SC1091,SC2154
[ -n "$INCLUDE_ONLY" ] || {
    . /lib/functions.sh
    . ../netifd-proto.sh
    init_proto "$@"
}
proto_tayga_managed_init_config() {
    no_device=1
    available=1
    proto_config_add_string owner_token
}
proto_tayga_managed_setup() {
    local interface="$1" expected=
    [ "$interface" = tayga_managed ] || return 1
    json_get_var expected owner_token
    TAYGA_NETWORK_LIBRARY=1 . /usr/libexec/tayga/openwrt-network
    net_owned && [ "$token" = "$expected" ] || return 1
    if ! net_setup; then
        proto_notify_error "$interface" TAYGA_NETWORK_FAILED
        proto_block_restart "$interface"
        return 1
    fi
    proto_init_update tmg0 1
    if [ "$mode" = clat ]; then
        proto_add_ipv4_address 192.0.0.1 255.255.255.255
        proto_add_ipv6_address "$source6" 128
        proto_add_ipv4_route "$addr4" 32
        proto_add_ipv4_route 0.0.0.0 1
        proto_add_ipv4_route 128.0.0.0 1
        proto_add_ipv6_route "${map6%/*}" 128
        case "$host_dns" in
            public*)
                proto_add_dns_server 1.1.1.1
                proto_add_dns_server 8.8.8.8
                ;;
        esac
    else
        proto_add_ipv4_address "$addr4" 255.255.255.255
        proto_add_ipv6_address "$source6" 128
        proto_add_ipv4_route "${pool%/*}" "${pool##*/}"
        proto_add_ipv6_route "${prefix%/*}" "${prefix##*/}"
    fi
    proto_add_data
    json_add_string tayga_owner "$token"
    proto_close_data
    proto_send_update "$interface"
}
proto_tayga_managed_teardown() {
    local expected=
    [ "$1" = tayga_managed ] || return 1
    json_get_var expected owner_token
    TAYGA_NETWORK_LIBRARY=1 . /usr/libexec/tayga/openwrt-network
    net_cleanup "$expected"
}
[ -n "$INCLUDE_ONLY" ] || add_protocol tayga_managed
