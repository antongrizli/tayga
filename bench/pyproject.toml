[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taygabench"
version = "0.1.0"
description = "Reproducible TAYGA benchmark studies and summaries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
taygabench = "taygabench.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taygabench*"]
